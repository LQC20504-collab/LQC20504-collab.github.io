baseURL: "https://LQC20504-collab.github.io/"
title: "LQC20504 的个人主页"
theme: "hugo-PaperMod"
defaultContentLanguage: "zh"
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true
timeZone: "Asia/Shanghai"
paginate: 10

params:
  env: production
  description: "LQC20504 的个人网站 - 博客、项目与履历"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  homeInfoParams:
    Title: "你好，我是 LQC20504 👋"
    Content: "欢迎来到我的个人主页。这里记录我的学习、项目与思考。"

menu:
  main:
    - identifier: about
      name: 关于我
      url: /about/
      weight: 10
    - identifier: posts
      name: 博客
      url: /posts/
      weight: 20
    - identifier: projects
      name: 项目
      url: /projects/
      weight: 30
    - identifier: resume
      name: 履历
      url: /resume/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

languages:
  zh:
    label: 中文
    weight: 1
    contentDir: content
    title: "LQC20504 的个人主页"
    params:
      description: "LQC20504 的个人网站 - 博客、项目与履历"
  en:
    label: English
    weight: 2
    contentDir: content/en
    title: "LQC20504's Homepage"
    params:
      description: "LQC20504's personal website - blog, projects & resume"
