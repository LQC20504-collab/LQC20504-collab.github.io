baseURL: "https://LQC20504-collab.github.io/"
title: "LQC20504 的个人主页"
theme: "hugo-PaperMod"
defaultContentLanguage: "zh"
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true
timeZone: "Asia/Shanghai"
paginate: 10

# 允许 Markdown 中的原始 HTML（如 <details> 折叠块）
markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON  # necessary for PaperMod search (index.json)

params:
  env: production
  description: "LQC20504 的个人网站 - 博客、项目与履历"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true

  # 评论区（giscus，基于 GitHub Discussions，登录即 GitHub 账号）
  # 使用方法见 GUIDE.md：先在 GitHub 仓库开启 Discussions 并安装 giscus App，
  # 再到 https://giscus.app 生成 repoId / categoryId 填入下方。
  giscus:
    repo: "LQC20504-collab/LQC20504-collab.github.io"
    repoId: "R_kgDOTozdJw"            # ← 待你在 giscus.app 生成后填入，填好前评论区不显示
    category: "Comments"  # ← 与仓库 Discussions 里的分类名一致
    categoryId: "DIC_kwDOTozdJ84DDb-J"        # ← 待你填入
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    theme: "preferred_color_scheme"
    lang: "zh-CN"         # 英文页面会自动切换为 en
    loading: "lazy"

  # 访问量统计（不蒜子，免费免注册；关闭请改 enable: false）
  busuanzi:
    enable: true

languages:
  zh:
    label: 中文
    weight: 1
    contentDir: content
    title: "LQC20504 的个人主页"
    params:
      description: "LQC20504 的个人网站 - 博客、项目与履历"
      homeInfoParams:
        Title: "你好，我是 LQC20504 👋"
        Content: "欢迎来到我的个人主页。这里记录我的学习、项目与思考。"
    menu:
      main:
        - identifier: about
          name: 关于我
          url: /about/
          weight: 10
        - identifier: posts
          name: 博客
          url: /posts/
          weight: 20
        - identifier: projects
          name: 项目
          url: /projects/
          weight: 30
        - identifier: resume
          name: 履历
          url: /resume/
          weight: 40
        - identifier: search
          name: 搜索
          url: /search/
          weight: 50
  en:
    label: English
    weight: 2
    contentDir: content-en
    title: "LQC20504's Homepage"
    params:
      description: "LQC20504's personal website - blog, projects & resume"
      homeInfoParams:
        Title: "Hi, I'm LQC20504 👋"
        Content: "Welcome to my personal homepage. Here I record my learning, projects, and thoughts."
    menu:
      main:
        - identifier: about
          name: About
          url: /en/about/
          weight: 10
        - identifier: posts
          name: Blog
          url: /en/posts/
          weight: 20
        - identifier: projects
          name: Projects
          url: /en/projects/
          weight: 30
        - identifier: resume
          name: Resume
          url: /en/resume/
          weight: 40
        - identifier: search
          name: Search
          url: /en/search/
          weight: 50
